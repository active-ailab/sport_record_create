<header class="topbar"><div><div class="eyebrow">SPORT RECORD / LOCAL TOOL</div><h1>运动记录生成器</h1><p class="hint">本地生成 · 不覆盖源文件</p></div><span class="brand-tag">DEVICE DATA LAB&nbsp; / &nbsp;V1.0</span></header>

<section class="panel route-panel" id="routePanel"><h2><span class="num">03</span>GPS 路线</h2><div class="route-head"><div class="field"><label>路线类型</label><select name="route"><option value="mountain">登山步道搜索</option><option value="a3">内置道路形状（按起终点缩放）</option><option value="straight">起终点直线</option><option value="amap">高德真实步行 / 骑行路线</option></select></div><div class="field" id="mountainField"><label>山峰</label><select name="mountain"><option value="zijinshan">南京紫金山</option><option value="huangshan">黄山</option><option value="taishan">泰山</option><option value="wuyi">武夷山</option><option value="himalaya">珠峰区域</option></select></div></div><div class="coords" id="coordsPanel" style="margin-top:13px"><div class="field"><label>起点纬度 / 经度</label><div class="inline"><input name="slat" value="32.0003"><input name="slon" value="118.74105"></div></div><div class="field"><label>终点纬度 / 经度</label><div class="inline"><input name="elat" value="31.966454"><input name="elon" value="118.721361"></div></div></div><div class="key-row"><div class="field"><label>高德 JS API Key <span id="keyState" class="key-state">未保存</span></label><div class="inline"><input id="amapKey" placeholder="输入 Key"><button type="button" id="saveKey" class="btn secondary">保存</button></div></div><div class="field"><label>安全码</label><div class="inline"><input id="amapSecurity" placeholder="可选"><button type="button" id="planAmap" class="btn secondary">规划路线</button></div></div></div><div id="map"></div><p class="map-note">登山按山峰搜索登山口与步道；其他运动严格按设置的起点、终点规划。</p></section></div>
</div></div></form>

$('#amapKey').value=localStorage.getItem('sport-record-amap-key')||'';$('#amapSecurity').value=localStorage.getItem('sport-record-amap-security')||'';const keyState=$('#keyState');function refreshKeyState(saved){keyState.textContent=saved?'Key 与安全码已保存':'未保存';keyState.classList.toggle('saved',saved)}refreshKeyState(!!($('#amapKey').value||$('#amapSecurity').value));$('#saveKey').onclick=()=>{localStorage.setItem('sport-record-amap-key',$('#amapKey').value.trim());localStorage.setItem('sport-record-amap-security',$('#amapSecurity').value.trim());refreshKeyState(true)};$('#amapKey').oninput=$('#amapSecurity').oninput=()=>refreshKeyState(false);
function concat(...xs){let n=xs.reduce((a,x)=>a+x.length,0),o=new Uint8Array(n),p=0;for(const x of xs){o.set(x,p);p+=x.length}return o}

function f32(x){let b=new ArrayBuffer(4);new DataView(b).setFloat32(0,x,true);return new Uint8Array(b)}

function points(name,count,slat,slon,elat,elon,mountain){mountain=mountain||document.querySelector('[name=mountain]').value;if(name==='amap'&&amapPath&&amapPath.length>1)return resamplePath(amapPath,count);let a=[];if(name==='mountain'){let c=mountains[mountain]||mountains.zijinshan;for(let i=0;i<count;i++){let p=i/Math.max(1,count-1),t=p<=.5?p*2:(1-p)*2;a.push([c[0]+.018*t+.004*Math.sin(t*7),c[1]+.022*t+.003*Math.sin(t*5)])}return a}if(name==='a3'){let first=route[0],last=route[route.length-1];for(let i=0;i<count;i++){let t=i/(count-1),q=Math.min(route.length-1,Math.floor(t*(route.length-1))),z=t*(route.length-1)-q,p=route[q],n=route[Math.min(q+1,route.length-1)],lon=p[0]+(n[0]-p[0])*z,lat=p[1]+(n[1]-p[1])*z;a.push([slon+(lon-first[0])/(last[0]-first[0])*(elon-slon),slat+(lat-first[1])/(last[1]-first[1])*(elat-slat)])}}else for(let i=0;i<count;i++){let t=i/(count-1);a.push([slon+(elon-slon)*t,slat+(elat-slat)*t])}return a}

function detail(ps,hrs,start,type,hasGps=true){let m=metrics(ps,type),o=concat(u8([1,12,112,115,109,104]),le64(start),u8([4,4,0,0,1,0]));for(let i=0;i<ps.length;i++){let t=start+i*1000,p=ps[i],speed=i?m.speeds[i-1]:0,pace=speed?Math.round(1000/speed):0,o2=concat(u8([1,12,112,115,109,104]),le64(t),u8([2,28,0,0]),le32(Math.floor(t/1000)),le32(Math.round(p[0]*3e6)),le32(Math.round(p[1]*3e6)),u8([12,0,12,0,i?Math.round(speed*60):0,0,1,0]),f32(bearing(p,ps[Math.min(i+1,ps.length-1)])),f32(3.5));if(m.totalSteps)o2=concat(o2,u8([5,8,0,0,(m.steps[i-1]||0)*60,(m.strides[i-1]||75)&255,((m.strides[i-1]||75)>>8)&255,pace&255,(pace>>8)&255]));o=concat(o,o2,u8([8,3,0,0,hrs[i]]))}return concat(o,u8([4,4,0,0,6,0]))}

$('[name=route]').onchange=()=>{if($('[name=sport_type]').value!=='10'){clearPlannedRoute();status.textContent='路线规范已更改，请点击“规划路线”查看并应用新规范。'}};document.querySelectorAll('[name=slat],[name=slon],[name=elat],[name=elon]').forEach(input=>input.addEventListener('input',()=>{if($('[name=sport_type]').value!=='10'&&$('[name=route]').value==='amap'){clearPlannedRoute();status.textContent='起点或终点已修改，请重新规划高德路线。'}}));
</script>
</html>
